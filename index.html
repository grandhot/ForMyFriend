<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>До Нового года</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 18px;
    font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color: #fff; overflow-x: hidden;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(107,128,213,.34), transparent 42%),
      radial-gradient(ellipse at 8% 52%, rgba(184,145,91,.19), transparent 26%),
      radial-gradient(ellipse at 94% 60%, rgba(119,157,218,.22), transparent 28%),
      radial-gradient(ellipse at 50% 100%, rgba(66,83,157,.34), transparent 42%),
      linear-gradient(145deg, #070b25 0%, #171d4b 48%, #090d2b 100%);
  }
  .scene { width: min(100%, 760px); position: relative; padding: 26px 0 20px; }
  .decor { position: absolute; inset: -18px -12px; pointer-events: none; overflow: hidden; }
  .decor:before, .decor:after {
    content:""; position:absolute; inset:4% 0; pointer-events:none;
    background:
      radial-gradient(circle at 14% 17%, #fff9 0 1px, transparent 2px),
      radial-gradient(circle at 82% 12%, #fff8 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 91% 39%, #dce7ffb8 0 2px, transparent 3px),
      radial-gradient(circle at 7% 72%, #fff8 0 1.5px, transparent 2.5px),
      radial-gradient(circle at 76% 88%, #fff9 0 1px, transparent 2px),
      radial-gradient(circle at 35% 94%, #dce7ff99 0 2px, transparent 3px);
    opacity:.8;
  }
  .decor:after {
    inset:0;
    background: repeating-linear-gradient(118deg, transparent 0 72px, rgba(255,255,255,.025) 73px 74px, transparent 75px 145px);
    opacity:.55;
  }
  .bauble { position: absolute; border-radius: 50%; opacity: .96;
    box-shadow: inset -13px -16px 24px rgba(0,0,0,.38), inset 8px 8px 15px rgba(255,255,255,.5), 0 12px 30px #0009; }
  .bauble:before { content:""; position:absolute; width:22%; height:12%; border-radius:50%;
    background:linear-gradient(90deg,#8b6a34,#fff0b5,#8b6a34); left:39%; top:-7%; }
  .b1 { width:94px;height:94px;left:-18px;top:35px;background:radial-gradient(circle at 32% 28%,#fff2bd,#d8a94d 34%,#7b3f2d 78%); }
  .b2 { width:76px;height:76px;right:5px;top:74px;background:radial-gradient(circle at 32% 28%,#fff,#a9c9f5 30%,#4357a8 76%); }
  .b3 { width:54px;height:54px;left:7%;bottom:55px;background:radial-gradient(circle at 32% 28%,#fff1d0,#c94b50 38%,#7b172c 78%); }
  .b4 { width:62px;height:62px;right:8%;bottom:35px;background:radial-gradient(circle at 32% 28%,#fff,#d8d9e8 30%,#6577bb 78%); }
  .doll {
    position:absolute; width:76px; height:104px; border-radius:46% 46% 42% 42%;
    background:
      radial-gradient(ellipse at 50% 28%, #fff4d9 0 28%, transparent 29%),
      radial-gradient(ellipse at 50% 62%, #c8d4f0 0 48%, #52659d 72%, #273568 100%);
    border:2px solid rgba(255,235,190,.58);
    box-shadow: inset 5px 5px 13px #ffffff9c, inset -8px -10px 16px #111b4d99, 0 12px 25px #0008;
    opacity:.76; filter: drop-shadow(0 0 10px #9eb5ff33);
  }
  .doll:before {
    content:""; position:absolute; width:44px; height:48px; left:14px; top:9px;
    border-radius:48% 48% 45% 45%;
    background:radial-gradient(circle at 35% 36%, #fff 0 2px, transparent 3px),
      radial-gradient(circle at 67% 36%, #fff 0 2px, transparent 3px),
      radial-gradient(ellipse at 50% 70%, #a94c52 0 5px, transparent 6px),
      radial-gradient(ellipse at 50% 42%, #e8c89e 0 55%, #bd956d 78%);
    box-shadow:inset 3px 3px 7px #fff9;
  }
  .doll:after {
    content:""; position:absolute; left:5px; right:5px; top:4px; height:17px;
    border-radius:50% 50% 15% 15%; background:linear-gradient(90deg,#20315f,#7891c8,#20315f);
    border-bottom:2px dotted #f4dca5;
  }
  .doll.left { left:-30px; top:30%; transform:rotate(-13deg) scale(1.18); }
  .doll.right { right:-28px; top:43%; transform:rotate(12deg) scale(1.08); }
  .doll.bottom { left:27%; bottom:-60px; transform:rotate(8deg) scale(.82); opacity:.55; }
  .snow { position:absolute; color:#fff; opacity:.68; text-shadow:0 0 12px #fff; }
  .s1{left:8%;top:20px;font-size:25px}.s2{right:15%;top:10px;font-size:18px}.s3{left:22%;bottom:10px;font-size:18px}.s4{right:25%;bottom:4px;font-size:25px}
  header { text-align:center; position:relative; z-index:1; margin: 0 0 26px; }
  h1 { margin:0; font-size:clamp(30px,7vw,54px); font-weight:750; letter-spacing:.01em; text-shadow:0 3px 20px #0008; }
  .subtitle { margin-top:8px; color:#d8defc; font-size:14px; letter-spacing:.18em; text-transform:uppercase; }
  .panel {
    position:relative; z-index:1; padding: clamp(24px,6vw,48px) clamp(14px,4vw,34px);
    border:1px solid rgba(255,255,255,.72); border-radius:34px;
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.055));
    box-shadow:0 22px 70px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .days { text-align:center; padding-bottom:22px; }
  .days .number { font-size:clamp(100px,24vw,190px); line-height:.95; font-weight:800; letter-spacing:-.065em; font-variant-numeric:tabular-nums; text-shadow:0 8px 28px #0003; }
  .days .unit { font-size:clamp(24px,5vw,38px); color:#eef0ff; margin-top:12px; }
  .clock { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px; margin-top:12px; }
  .unitbox { min-width:0; text-align:center; padding:22px 8px 18px; border:1px solid rgba(255,255,255,.62); border-radius:28px;
    background:rgba(255,255,255,.09); box-shadow:inset 0 1px 0 #ffffff22; }
  .unitbox.seconds {
    --glow: 255, 70, 70;
    background:linear-gradient(145deg, rgba(var(--glow),.42), rgba(var(--glow),.19));
    border:2px solid rgba(var(--glow),1);
    box-shadow:inset 0 1px 0 #ffffffd9, 0 0 0 2px rgba(var(--glow),.22), 0 0 34px rgba(var(--glow),.55);
    transition:background .8s ease, border-color .8s ease, box-shadow .8s ease;
  }
  .unitbox.seconds .number {
    color:#fff;
    font-weight:850;
    text-shadow:0 0 8px rgba(255,255,255,.95), 0 0 24px rgba(var(--glow),.95), 0 0 42px rgba(var(--glow),.72);
    transition:text-shadow .8s ease;
  }
  .unitbox.seconds .label { color:#fff; font-weight:650; text-shadow:0 1px 8px rgba(var(--glow),.9); }
  .unitbox .number { display:block; font-size:clamp(34px,9vw,66px); line-height:1.05; font-weight:750; font-variant-numeric:tabular-nums; }
  .unitbox .label { display:block; margin-top:9px; font-size:clamp(15px,3.5vw,24px); color:#e6e9ff; }
  footer { position:relative; z-index:1; text-align:center; margin-top:20px; color:#c7cdec; font-size:13px; }
  @media (max-width:430px) {
    body { padding:10px; }
    .scene { padding-top:18px; }
    .clock { gap:8px; }
    .unitbox { border-radius:22px; padding:18px 4px 15px; }
    .panel { border-radius:28px; }
    .b1 { width:65px;height:65px;left:-14px;top:45px; }
    .b2 { width:56px;height:56px;right:-8px;top:88px; }
  }
</style>
</head>
<body>
<main class="scene">
  <div class="decor" aria-hidden="true">
    <span class="bauble b1"></span><span class="bauble b2"></span>
    <span class="bauble b3"></span><span class="bauble b4"></span>
    <span class="doll left"></span><span class="doll right"></span><span class="doll bottom"></span>
    <span class="snow s1">✧</span><span class="snow s2">❄</span>
    <span class="snow s3">✦</span><span class="snow s4">❄</span>
  </div>
  <header>
    <h1>До Нового года</h1>
    <div class="subtitle">Время чудес уже близко</div>
  </header>
  <section class="panel" aria-label="Обратный отсчёт до Нового года">
    <div class="days">
      <div class="number" id="days">—</div>
      <div class="unit" id="days-label">дней</div>
    </div>
    <div class="clock">
      <div class="unitbox"><span class="number" id="hours">00</span><span class="label">часов</span></div>
      <div class="unitbox"><span class="number" id="minutes">00</span><span class="label">минут</span></div>
      <div class="unitbox seconds"><span class="number" id="seconds">00</span><span class="label">секунд</span></div>
    </div>
  </section>
  <footer>Отсчёт обновляется каждую секунду · по местному времени устройства</footer>
</main>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const plural = (n, forms) => {
    const x = n % 100, y = n % 10;
    if (x >= 11 && x <= 14) return forms[2];
    if (y === 1) return forms[0];
    if (y >= 2 && y <= 4) return forms[1];
    return forms[2];
  };
  function tick() {
    const now = new Date();
    const target = new Date(now.getFullYear() + 1, 0, 1, 0, 0, 0);
    let left = Math.max(0, target.getTime() - now.getTime());
    const days = Math.floor(left / 86400000); left %= 86400000;
    const hours = Math.floor(left / 3600000); left %= 3600000;
    const minutes = Math.floor(left / 60000); left %= 60000;
    const seconds = Math.floor(left / 1000);
    $('days').textContent = days;
    $('days-label').textContent = plural(days, ['день','дня','дней']);
    $('hours').textContent = String(hours).padStart(2,'0');
    $('minutes').textContent = String(minutes).padStart(2,'0');
    $('seconds').textContent = String(seconds).padStart(2,'0');
    const rainbow = [
      '255, 55, 75',
      '255, 145, 35',
      '255, 215, 55',
      '55, 220, 125',
      '75, 145, 255'
    ];
    document.querySelector('.unitbox.seconds').style.setProperty('--glow', rainbow[Math.floor(Date.now() / 1000) % rainbow.length]);
    if (days === 0 && hours === 0 && minutes === 0 && seconds === 0) {
      $('days-label').textContent = 'С Новым годом!';
    }
  }
  tick();
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
